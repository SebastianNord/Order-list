<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c1338">
<meta name="color-scheme" content="light dark">
<title>Order List</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: plum command band (brand, big "add item" bar, cut-off strip) over a light work surface of cards.
   Electricians see their own list; the lead sees everything merged, with who asked for what. */
:root{
  --bg:#f6f2f7; --surface:#ffffff; --surface2:#f0e9f3; --fg:#2c1338;
  --muted:#7a6985; --line:#e5dbea; --accent:#d94fa8; --accent-ink:#ffffff; --accent-soft:#fbe3f3;
  --plum:#2c1338; --plum-2:#43224f; --plum-fg:#ffffff; --plum-muted:#c9b3d3;
  --ok:#17936a; --ok-soft:#dcf4ea; --warn:#b86a00; --warn-soft:#fdeccc; --danger:#cf3f58;
  --shadow:0 1px 2px rgba(44,19,56,.06),0 6px 18px rgba(44,19,56,.07);
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a0c21; --surface:#291534; --surface2:#34203f; --fg:#f5ecf9; --muted:#b6a3c2; --line:#46304f;
    --accent:#ee6dbd; --accent-ink:#2a0b20; --accent-soft:#4a2146;
    --plum:#11061a; --plum-2:#2b1537; --ok:#4cd6a2; --ok-soft:#153b30; --warn:#f2b44e; --warn-soft:#41300f; --danger:#ff7b92;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a0c21; --surface:#291534; --surface2:#34203f; --fg:#f5ecf9; --muted:#b6a3c2; --line:#46304f;
  --accent:#ee6dbd; --accent-ink:#2a0b20; --accent-soft:#4a2146;
  --plum:#11061a; --plum-2:#2b1537; --ok:#4cd6a2; --ok-soft:#153b30; --warn:#f2b44e; --warn-soft:#41300f; --danger:#ff7b92;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--plum);z-index:10}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:not(:disabled):active{filter:brightness(.95)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{display:inline-flex;width:1.2em;height:1.2em;flex:none}.ic svg{width:100%;height:100%}

/* band */
.top{background:var(--plum);color:var(--plum-fg);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:22px}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.sp{flex:1}
.seg{display:inline-flex;background:var(--plum-2);border-radius:999px;padding:3px}
.seg button{padding:5px 12px;border-radius:999px;color:var(--plum-muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--plum-fg);color:var(--plum)}
.me{display:flex;align-items:center;gap:8px;background:var(--plum-2);border-radius:999px;padding:4px 6px 4px 4px;min-width:0}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me .nm{font-weight:500;font-size:13px;max-width:11ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rolechip{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--plum-muted)}
.iconbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--plum-muted)}
.iconbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.pid{font-family:var(--mono);font-size:12px;background:var(--plum-2);border-radius:8px;padding:4px 8px;color:var(--plum-muted);max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cogroup{display:grid;gap:8px}
.cobox{position:relative}
.cogroup .hint:empty{display:none}
.linkbtn{justify-self:start;color:var(--accent);font-weight:600;font-size:14px;padding:2px;text-decoration:underline;text-underline-offset:3px}
.addbox{display:grid;gap:12px;border:2px dashed var(--line);border-radius:14px;padding:12px}
.addbox[hidden],.simbox[hidden]{display:none}
.simbox{display:grid;gap:6px}
.sim{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:var(--surface2);color:var(--fg);font-size:15px}
.sim .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sim .sa{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);color:var(--fg);border-radius:20px;padding:8px 8px 8px 18px;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.bar input.txt{flex:1 1 150px;min-width:0;border:0;background:transparent;font-size:17px;padding:10px 0;outline:none}
.bar input.txt::placeholder{color:var(--muted)}
.bar:focus-within{box-shadow:0 14px 34px rgba(0,0,0,.3),0 0 0 3px var(--accent)}
.bar{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;background:var(--surface);color:var(--fg);border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.3);padding:6px;display:flex;flex-direction:column;gap:2px}
.sug[hidden]{display:none}
.sug button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:15px;color:var(--fg)}
.sug button .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug button .sa{font-family:var(--mono);font-size:12px;background:var(--surface2);color:var(--muted);border-radius:8px;padding:3px 8px;flex:none}
.sug button[aria-selected="true"],.sug button:hover{background:var(--accent-soft)}
.step{display:inline-flex;align-items:center;background:var(--surface2);border-radius:999px}
.step button{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.step button:hover{background:var(--line)}
.step output{min-width:2.2ch;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.go{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(217,79,168,.45)}
.go .ic{width:28px;height:28px}
.go:disabled,.bar input:disabled{opacity:.5;cursor:not-allowed}
.favs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.favs .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--plum-muted);font-weight:600}
.chip{background:var(--plum-2);color:var(--plum-fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{background:var(--accent);color:var(--accent-ink)}
.cut{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--plum-muted);flex-wrap:wrap}
.cut b{color:var(--plum-fg);font-weight:600}
.meter{flex:1 1 120px;height:6px;border-radius:99px;background:var(--plum-2);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.meter.closed i{background:var(--warn)}
.cut input[type=time]{background:var(--plum-2);border:0;border-radius:8px;color:#fff;padding:3px 6px;color-scheme:dark}

/* body */
main{padding-block:22px 80px}
.tabs{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:18px}
.tabs::-webkit-scrollbar{display:none}
.tabs>*{flex-shrink:0}
.tab{padding:9px 18px;border-radius:999px;font-weight:600;color:var(--muted);background:transparent;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs .sp{flex:1}
.tabs .seg{background:var(--surface2)}
.tabs .seg button{color:var(--muted)}
.tabs .seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px;font-weight:500}
.banner.info{background:var(--accent-soft);color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.card.done{background:var(--ok-soft)}
.qty{min-width:48px;height:48px;padding:0 10px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:18px;display:grid;place-items:center;font-variant-numeric:tabular-nums;flex:none}
.done .qty{background:var(--ok);color:#fff}
.qty.hasimg{position:relative;width:56px;min-width:56px;height:56px;padding:0;background:#fff;overflow:visible;display:block}
.done .qty.hasimg{background:#fff}
.qty.hasimg img{display:block;width:100%;height:100%;object-fit:contain;border-radius:14px}
.qty .qb{position:absolute;right:-6px;bottom:-6px;min-width:24px;padding:3px 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;line-height:1.1;font-weight:700;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.done .qty .qb{background:var(--ok)}
.main{flex:1 1 200px;min-width:0}
.title{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.done .pill.ok{background:var(--surface);}
.pill.late{background:var(--warn-soft);color:var(--warn)}
.pill.who{background:var(--surface2);color:var(--fg)}
.pill.art{font-family:var(--mono);background:var(--surface2);color:var(--fg)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.lnk{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surface2);font-weight:500;font-size:13px;text-decoration:none;color:var(--fg)}
.lnk:hover{background:var(--accent-soft)}
.sq{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface2)}
.sq:hover{color:var(--fg);background:var(--line)}
.sq.on{color:#d99a00;background:var(--warn-soft)}
.sq.del:hover{color:var(--danger)}
.sq.del.sure{width:auto;padding:0 14px;background:var(--danger);color:#fff;font-weight:600;font-size:13px}
.pill .x{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;margin-left:2px;color:var(--muted);font-size:12px}
.pill .x .ic{width:12px;height:12px}
.pill .x:hover{background:var(--line);color:var(--danger)}
.pill .x.sure{width:auto;padding:0 8px;border-radius:999px;background:var(--danger);color:#fff;font-weight:600}
.mini{display:inline-flex;align-items:center;background:var(--surface2);border-radius:999px}
.mini button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.mini button:hover{background:var(--line)}
.mini output{min-width:2ch;text-align:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
input.ed{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;font-size:15px;min-width:0}
input.ed:focus{outline:none;border-color:var(--accent)}
.editform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.editform input.ed.tx{flex:2 1 160px}.editform input.ed.no{flex:1 1 110px;font-family:var(--mono);font-size:13px}
.artno{font-family:var(--mono);font-size:13px;padding:0 10px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--surface2);min-width:64px;text-align:center}.artno.none{color:var(--muted)}
input.art{width:130px;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;font-family:var(--mono);font-size:13px}
input.art:focus{outline:none;border-color:var(--accent)}
.ord{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;font-weight:600;background:var(--fg);color:var(--bg)}
.ord.on{background:var(--ok);color:#fff}
.ord:hover{filter:brightness(1.1)}
.person{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.person h3{margin:0 0 10px;display:flex;gap:10px;align-items:center;font-size:16px}
.person h3 span.n{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.grph{margin:22px 0 10px;display:flex;gap:10px;align-items:center;font-size:16px;text-transform:capitalize}
.grph:first-child{margin-top:4px}
.grph .n{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.line{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.line .q{min-width:3ch;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.line .t{flex:1;min-width:0;overflow-wrap:anywhere}
.line.ordered .t{color:var(--muted);text-decoration:line-through}
.day{margin-bottom:22px}
.day h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;gap:10px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:22px;padding:34px 20px;text-align:center}
.empty svg{width:96px;height:96px;margin-bottom:6px}
.empty h2{margin:6px 0 4px;font-size:20px}.empty p{margin:0 auto;color:var(--muted);max-width:42ch}
.foot{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.foot .grp{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);padding:8px;border-radius:20px;box-shadow:0 10px 30px rgba(44,19,56,.25)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:600;background:var(--surface2)}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}.btn.pri:hover{filter:brightness(1.08)}
.csvbox{width:100%;min-height:140px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:12px;font-family:var(--mono);font-size:12px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:500;opacity:0;pointer-events:none;z-index:30;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* join */
.join{min-height:100vh;background:var(--plum);color:var(--plum-fg);padding-top:calc(36px + env(safe-area-inset-top,0px));padding-bottom:48px}
.join h1{font-size:clamp(30px,7vw,48px);line-height:1.05;letter-spacing:-.02em;margin:22px 0 10px;text-wrap:balance;max-width:16ch}
.join p.lead{color:var(--plum-muted);max-width:44ch;margin:0 0 24px;font-size:17px}
.form{background:var(--surface);color:var(--fg);border-radius:22px;padding:20px;display:grid;gap:14px;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.form label{display:grid;gap:6px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.form input[type=text]{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;font-size:17px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--fg)}
.form input[type=text]:focus{outline:none;border-color:var(--accent)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role{padding:12px;border-radius:14px;border:2px solid var(--line);font-weight:600;text-align:center;color:var(--fg)}
.role[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.form .go2{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);padding:15px;border-radius:16px;font-weight:700;font-size:17px;box-shadow:0 6px 16px rgba(217,79,168,.4)}
.form .alt{color:var(--accent);font-weight:600;text-align:center;padding:4px;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--danger);font-size:13px;font-weight:500;min-height:1em}
.hint{font-size:13px;color:var(--muted);margin:0;text-transform:none;letter-spacing:0;font-weight:400}
.copy{cursor:pointer}.supcycle{height:38px;min-width:64px;max-width:190px;padding:0 10px;justify-content:center;border-radius:12px;font-size:13px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sq.wide{width:auto;min-width:64px;padding:0 10px}
.sel{max-width:190px;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;font-size:13px}
.sel:focus{outline:none;border-color:var(--accent)}
.sel:disabled,.btn:disabled,.ord:disabled{opacity:.5;cursor:not-allowed}
.supchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.supchips button{padding:7px 14px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:13px}
.supchips button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.form.supform{box-shadow:var(--shadow);margin-top:20px;max-width:none}
/* motion: only add, remove and mark as ordered animate; switched off by the reduced-motion rule */
.card.fresh{animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:translateY(-18px) scale(.88);opacity:0}to{transform:none;opacity:1}}
@keyframes leave{
  0%{opacity:1;transform:none;height:var(--h)}
  45%{opacity:0;transform:translateX(60px) scale(.9);height:var(--h)}
  100%{opacity:0;transform:translateX(60px) scale(.9);height:0;padding-block:0;margin-top:-10px}}
@keyframes leaveline{
  0%{opacity:1;transform:none;height:var(--h)}
  50%{opacity:0;transform:translateX(40px);height:var(--h)}
  100%{opacity:0;transform:translateX(40px);height:0;padding-block:0;border-top-width:0}}
@keyframes checked{0%{transform:scale(1)}35%{transform:scale(1.04);box-shadow:0 0 0 6px var(--ok-soft)}100%{transform:none}}
@keyframes tick{from{transform:scale(0) rotate(-60deg)}to{transform:none}}
#content .card.leaving{animation:leave .4s cubic-bezier(.2,.8,.2,1) forwards;overflow:hidden;pointer-events:none}
#content .line.leaving{animation:leaveline .4s cubic-bezier(.2,.8,.2,1) forwards;overflow:hidden;pointer-events:none}
.card.checked{animation:checked .6s cubic-bezier(.34,1.56,.64,1)}
.card.checked .ord .ic,.card.checked .qty{animation:tick .55s cubic-bezier(.34,1.56,.64,1)}
.step output,.mini output{display:inline-block}
.bump{animation:bump .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:scale(1.4)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.acts{margin-left:0;width:100%}.card{padding:14px}}

/* ---------- tiny helpers ---------- */
function h(tag,props){
  var e=document.createElement(tag), p=props||{};
  for(var k in p){var v=p[k]; if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];
    (Array.isArray(c)?c:[c]).forEach(function(x){ if(x==null||x===false)return; e.append(x.nodeType?x:document.createTextNode(String(x))); });}
  return e;
}

var mem={};
function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){ if(v===undefined) return mem[k]==null?null:mem[k]; mem[k]=v; } return null;}
function pad(n){return (n<10?'0':'')+n;}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return dstr(new Date());}
function norm(s){return s.toLowerCase().replace(/\s+/g,' ').trim();}
function slug(s){return Array.from(norm(s)).map(function(c){return /[a-z0-9]/.test(c)?c:'_'+c.charCodeAt(0).toString(16);}).join('').slice(0,120)||'x';}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},2600);}

function reduced(){return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
function buzz(ms){if(!reduced()&&navigator.vibrate){try{navigator.vibrate(ms);}catch(e){}}}
var checked={};
function replay(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
/* slide a card (or all cards of a group) out and collapse the gap, then resolve; the data is removed after */
function leaveAnim(ids){
  if(reduced())return Promise.resolve();
  var els=[];
  Array.prototype.forEach.call(document.querySelectorAll('[data-id],[data-ids]'),function(e){
    var mine=(e.getAttribute('data-ids')||e.getAttribute('data-id')).split(',');
    if(mine.every(function(x){return ids.indexOf(x)>=0;}))els.push(e);
  });
  if(!els.length)return Promise.resolve();
  els.forEach(function(e){e.style.setProperty('--h',e.offsetHeight+'px');e.classList.add('leaving');});
  return new Promise(function(r){setTimeout(r,400);});
}

var S={edit:null,session:null,items:[],favs:[],cutoff:'15:00',tab:'today',view:'item',hview:'date',ready:false,local:false,demo:false,offline:false,

  sups:[],defaultId:null,supFilter:'all',supEdit:null};
var unsubs=[],slowTimer=null,tick=null,busy={};
/* lastSig: what the screen was last built from, so identical data never redraws.
   popped: items whose "pop" animation already played. pendingQty: quantity taps not yet saved. */
var lastSig=null,popped={},pendingQty={},renderT=null,imgOk={};
var app=document.getElementById('app');
var CFG=window.APP_CONFIG||{};var sb=null;
try{ if(window.supabase&&CFG.url&&CFG.key) sb=window.supabase.createClient(CFG.url,CFG.key); }catch(e){ sb=null; }

/* ---------- data layer ---------- */
function isLead(){return S.session&&S.session.role==='lead';}
function isLate(){var c=S.cutoff.split(':'),n=new Date();return n.getHours()*60+n.getMinutes()>=(+c[0])*60+(+c[1]||0);}
function newId(){return 'l'+Math.random().toString(36).slice(2,10);}

var pollTimer=null,refetchT=null,channel=null;
function stopSync(){
  unsubs.forEach(function(u){try{u();}catch(e){}});unsubs=[];
  clearTimeout(slowTimer);clearTimeout(refetchT);clearInterval(pollTimer);
  if(channel&&sb){try{sb.removeChannel(channel);}catch(e){}}channel=null;
}
function mapRow(r){return {id:r.id,pid:r.project_id,date:r.day,text:r.text,key:r.key,qty:r.qty,by:r.by_name,at:r.created_at,late:r.late,article:r.article||'',ordered:r.ordered,sup:r.supplier_id||null};}
async function ensureAuth(){
  var g=await sb.auth.getSession();
  var ses=g.data&&g.data.session;
  if(!ses){var r=await sb.auth.signInAnonymously();if(r.error)throw r.error;ses=r.data.session;}
  S.uid=ses.user.id;return ses;
}
/* a quantity the user tapped but the server has not confirmed yet wins over what the server sends back */
function keepPending(rows){
  rows.forEach(function(r){var p=pendingQty[r.id];if(p)r.qty=p.qty;});
  return rows;
}
/* apply one changed row (from our own insert or from realtime) without reloading the list */
function upsertItem(row){
  keepPending([row]);
  var i=S.items.findIndex(function(x){return x.id===row.id;});
  if(i<0)S.items.push(row);else S.items[i]=row;
}
/* several realtime events in a row cause one redraw */
function softRender(){clearTimeout(renderT);renderT=setTimeout(render,40);}
/* full reload. itemsOnly skips the project settings call (used when rolling back a failed save). */
async function refetch(gen,itemsOnly){
  if(S.demo||!S.session||!sb)return;
  var pid=S.session.pid,co=S.session.co,since=dstr(new Date(Date.now()-8*864e5));
  try{
    var a=await sb.from('items').select('*').eq('company_id',co).eq('project_id',pid).gte('day',since).order('created_at',{ascending:true}).limit(1000);
    if(gen!==S.gen)return;
    if(a.error)throw a.error;
    S.items=keepPending(a.data.map(mapRow));S.ready=true;S.slow=false;clearTimeout(slowTimer);
    if(!itemsOnly){
      var p=await sb.from('projects').select('cutoff,default_supplier_id').eq('company_id',co).eq('id',pid).maybeSingle();
      if(gen!==S.gen)return;
      if(p.data){S.defaultId=p.data.default_supplier_id||null;}
      if(p.data&&p.data.cutoff&&!S.editCut){S.cutoff=String(p.data.cutoff).slice(0,5);updateCut();}
    }
    render();
  }catch(e){ if(gen!==S.gen)return; S.ready=true;S.slow=true;render(); }
}
/* history: every distinct item ever added in this project (no names, no status), newest wording wins */
function histFrom(rows){
  return rows.map(function(r){return {id:r.id,key:r.key||norm(r.text),text:r.text,article:r.article||'',qty:+r.qty||1,by:r.by,date:r.date,at:r.at};})
    .sort(function(x,y){return (y.at||'').localeCompare(x.at||'');});
}
async function loadHistory(){
  var gen=S.gen;
  if(!S.session)return;
  if(S.demo||S.local){S.hist=histFrom(S.items);render();return;}
  if(!sb)return;
  S.histLoading=!S.hist;S.histErr=false;render();
  try{
    var rows=[],from=0,size=1000,co=S.session.co,pid=S.session.pid;
    for(;;){
      var r=await sb.from('items').select('id,key,text,article,qty,by_name,day,created_at').eq('company_id',co).eq('project_id',pid)
        .order('created_at',{ascending:false}).order('id').range(from,from+size-1);
      if(gen!==S.gen)return;
      if(r.error)throw r.error;
      rows=rows.concat(r.data);
      if(r.data.length<size)break;
      from+=size;
    }
    S.hist=histFrom(rows.map(function(r){return {id:r.id,key:r.key,text:r.text,article:r.article,qty:r.qty,by:r.by_name,date:r.day,at:r.created_at};}));
  }catch(e){ if(gen!==S.gen)return; S.histErr=true; }
  S.histLoading=false;render();
}
async function loadFavs(gen){
  try{
    var f=await sb.from('favorites').select('list').eq('company_id',S.session.co).eq('project_id',S.session.pid).maybeSingle();
    if(gen!==S.gen)return;
    S.favs=(f.data&&Array.isArray(f.data.list))?f.data.list:[];renderFavs();
  }catch(e){}
}
async function connect(){
  var gen=++S.gen;stopSync();
  S.items=[];S.favs=[];S.hist=null;S.histLoading=false;S.histErr=false;S.hq={};S.ready=false;S.slow=false;S.local=false;S.offline=false;S.canWrite=true;
  S.sups=[];S.defaultId=null;S.supFilter='all';S.supEdit=null;
  if(S.demo){S.local=true;S.items=demoItems();S.sups=demoSuppliers();S.ready=true;render();return;}
  if(!sb){S.offline=true;S.ready=true;render();return;}
  slowTimer=setTimeout(function(){ if(!S.ready){S.slow=true;render();} },10000);
  try{
    var ses=await ensureAuth();if(gen!==S.gen)return;
    var m=await sb.from('members').select('name,role').eq('company_id',S.session.co).eq('project_id',S.session.pid).eq('user_id',ses.user.id).maybeSingle();
    if(gen!==S.gen)return;
    if(m.error)throw m.error;
    if(!m.data){leave();toast(t('rejoin'));return;}
    S.session.name=m.data.name;S.session.role=m.data.role;
    ls('ol.session',JSON.stringify(S.session));buildShell();
  }catch(e){ if(gen!==S.gen)return; S.ready=true;S.slow=true;render();return; }
  var pid=S.session.pid;
  /* realtime filters take one column; other companies' rows are blocked by RLS, so project_id is enough */
  /* a changed row is applied straight from the event: no server call. Our own saves come back as the same
     data, so nothing changes on screen. DELETE events are not delivered with a filter, so the poll below catches those. */
  var down=false;
  function startPoll(ms){clearInterval(pollTimer);pollTimer=setInterval(function(){refetch(gen);},ms);}
  channel=sb.channel('items-'+S.session.co+'-'+pid).on('postgres_changes',{event:'*',schema:'public',table:'items',filter:'project_id=eq.'+pid},function(p){
    if(gen!==S.gen)return;
    var n=p.new,o=p.old;
    if(p.eventType==='DELETE'){
      if(o&&o.id!=null){S.items=S.items.filter(function(x){return x.id!==o.id;});softRender();}
      else{clearTimeout(refetchT);refetchT=setTimeout(function(){refetch(gen,true);},150);}
    }else if(n&&n.id!=null){
      if(n.company_id!==S.session.co)return;
      upsertItem(mapRow(n));softRender();
    }else{clearTimeout(refetchT);refetchT=setTimeout(function(){refetch(gen,true);},150);}
  }).subscribe(function(status){
    if(gen!==S.gen)return;
    if(status==='SUBSCRIBED'){startPoll(30000);if(down){down=false;refetch(gen);}}
    else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){down=true;startPoll(10000);}
  });
  startPoll(10000);
  await refetch(gen);loadFavs(gen);loadSuppliers(gen);
}

/* ---------- suppliers ----------
   Presets (company null) are shared by all companies; own suppliers belong to the company and are edited by its leads.
   A supplier is a name plus a search link where {q} is replaced by the article number or search word. */
function mapSup(r){return {id:r.id,co:r.company_id||null,name:r.name,url:r.search_url,sort:r.sort,hidden:!!r.is_hidden};}
function sortSups(a){return a.slice().sort(function(x,y){
  return ((x.co?1:0)-(y.co?1:0))||((x.sort||0)-(y.sort||0))||x.name.localeCompare(y.name,lang);});}
async function loadSuppliers(gen){
  if(!S.session||S.demo||!sb)return;
  if(gen===undefined)gen=S.gen;
  try{
    var r=await sb.from('suppliers').select('id,company_id,name,search_url,sort,is_hidden').order('sort').order('name');
    if(gen!==S.gen)return;
    if(r.error)throw r.error;
    S.sups=sortSups(r.data.map(mapSup));
    if(S.supEdit&&!supById(S.supEdit))S.supEdit=null;
    render();
  }catch(e){}
}

function paintQty(it){

  var o=card.querySelector('.mini output');if(o){o.textContent=String(it.qty);replay(o,'bump');}

  if(box){var qb=box.querySelector('.qb');if(qb)qb.textContent='×'+it.qty;else box.textContent='×'+it.qty;replay(box,'bump');}

function bumpQty(id,d){
  var it=S.items.find(function(i){return i.id===id;});
  if(!it||it.ordered||!S.canWrite)return;
  var q=Math.max(1,Math.min(999,(+it.qty||1)+d));if(q===it.qty)return;
  it.qty=q;paintQty(it);
  if(S.local)return;
  var p=pendingQty[id]||(pendingQty[id]={qty:q,timer:null,flying:false});
  p.qty=q;clearTimeout(p.timer);p.timer=setTimeout(function(){flushQty(id);},500);
}
async function flushQty(id){
  var p=pendingQty[id];if(!p||p.flying)return;
  p.flying=true;var sent=p.qty,gen=S.gen;
  try{
    var r=await sb.from('items').update({qty:sent}).eq('id',id);
    if(r.error)throw r.error;
  }catch(e){
    clearTimeout(p.timer);delete pendingQty[id];toast(t('errWrite'));refetch(gen,true);return;
  }
  p.flying=false;
  if(p.qty!==sent){clearTimeout(p.timer);flushQty(id);}
  else{clearTimeout(p.timer);delete pendingQty[id];}
}

function digits(s){return String(s||'').replace(/\D/g,'');}

/* search stored companies by name or org. number prefix; nameOnly skips the org. number match */
async function searchCompanies(q,nameOnly){
  var txt=String(q||'').replace(/[\\%_,().*:"']/g,' ').replace(/\s+/g,' ').trim(),d=digits(q);
  if(!sb)return [];
  var f=[];
  if(txt.length>=2)f.push('name.ilike.*'+txt+'*');
  if(!nameOnly&&d.length>=2)f.push('org_nr.like.'+d+'*');
  if(!f.length)return [];
  await ensureAuth();
  var r=await sb.from('companies').select('org_nr,name').or(f.join(',')).order('name').limit(6);
  if(r.error)throw r.error;
  return r.data||[];
}

function groups(items){
  var m={},order=[];
  items.forEach(function(i){
    var k=i.key||norm(i.text),g=m[k];
    if(!g){g=m[k]={key:k,text:i.text,qty:0,entries:[],article:'',ordered:true,late:false};order.push(g);}
    g.qty+=(+i.qty||1);g.entries.push(i);if(i.article&&!g.article)g.article=i.article;if(!i.ordered)g.ordered=false;if(i.late)g.late=true;
  });
  return order;
}
function byPerson(g){var m={},o=[];g.entries.forEach(function(e){if(!m[e.by]){m[e.by]={by:e.by,qty:0};o.push(m[e.by]);}m[e.by].qty+=(+e.qty||1);});return o;}
function sortGroups(gs){return gs.slice().sort(function(a,b){return (a.ordered-b.ordered)||a.text.localeCompare(b.text,lang);});}

/* Android only: open the supplier's app if it is installed, else the website (Chrome intent link with a fallback).
   iPhone cannot tell whether an app is installed, so it always gets the website. Add a host here when its package ID is known. */
var APP_PKG={'rexel.se':'com.rexel.RexelSE'};
var IS_ANDROID=/Android/i.test(navigator.userAgent||'');
function appHref(url){
  var host=supHost(url),pkg=IS_ANDROID&&APP_PKG[host];
  if(!pkg)return null;
  return 'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package='+pkg+';S.browser_fallback_url='+encodeURIComponent(url)+';end';
}

  var q=(article||'').trim()||text,url=supUrl(sup,q),app=appHref(url);

function qtyBox(article,qty){
  var art=(article||'').trim(),label='×'+qty,box=h('div',{class:'qty'},label);
  if(!art||imgState[art]===false)return box;
  function show(img){box.classList.add('hasimg');box.textContent='';box.append(img,h('span',{class:'qb'},label));}
  /* an image that already loaded is drawn at once from a copy, so a redraw never flashes the plain number first */
  if(imgOk[art]){var c=imgOk[art].cloneNode();c.decoding='sync';show(c);return box;}
  var img=new Image();img.alt='';img.decoding='async';img.referrerPolicy='no-referrer';
  img.onload=function(){imgState[art]=true;imgOk[art]=img;var c=img.cloneNode();c.decoding='sync';show(c);};
  img.onerror=function(){imgState[art]=false;};
  img.src=IMG_BASE+encodeURIComponent(art)+'/MEDIUM';

function suggest(q){
  var nq=norm(q||'');if(nq.length<2)return [];
  var d=today(),me=S.session.name,mine={},g={};
  S.items.forEach(function(i){if(i.date===d&&i.by===me)mine[i.key]=1;});
  S.items.forEach(function(i){
    if(!i.key||i.key.indexOf(nq)<0||mine[i.key])return;
    var at=i.at||'',x=g[i.key]||(g[i.key]={text:i.text,article:'',artAt:'',n:0,at:''});

    if(i.article&&at>=x.artAt){x.article=i.article;x.artAt=at;}

    .sort(function(a,b){return b.n-a.n||b.at.localeCompare(a.at);}).slice(0,5);

  /* catalog matches (article number prefix or name), added after history, max 5 in total */
  async function catalogSug(q,hist){

      var r=await sb.from('supplier_catalog').select('article_no,name')

  /* local clock only, no server call. The text and the edit control are rebuilt only when what they show
     changes, so the 30-second tick no longer replaces the time field while a lead is typing in it. */
  var tail;
  if(left>0){var hh=Math.floor(left/60),mm=Math.ceil(left%60);if(mm===60){hh++;mm=0;}tail=' · '+(hh?hh+' h ':'')+mm+' min '+t('left');

  var tk=lang+'|'+S.cutoff+'|'+tail;

  var opts=[{id:null,label:d?d.name:t('noSup')}];

  var i=0;opts.forEach(function(o,n){if(cur&&o.id===cur.id)i=n;});
  var next=opts[(i+1)%opts.length];
  return h('button',{type:'button',class:'btn supcycle','aria-label':t('supplierFor')+' '+g.text+': '+opts[i].label,title:t('supplierFor')+' '+g.text,disabled:!S.canWrite||null,
    onclick:function(){setForGroup(g,{supplier_id:next.id});}},opts[i].label);
}
function groupCard(g,locked){
  var meta=h('div',{class:'meta'});
  byPerson(g).forEach(function(p){
    var ids=g.entries.filter(function(e){return e.by===p.by;}).map(function(e){return e.id;}),k='p:'+g.key+'|'+p.by,sure=S.confirm===k;
    meta.append(h('span',{class:'pill who'},p.by+' ×'+p.qty,
      S.canWrite?h('button',{type:'button',class:'x'+(sure?' sure':''),'aria-label':t('delOne')+': '+p.by,title:sure?t('delSure'):t('delOne'),onclick:function(){askDelete(k,ids);}},sure?t('delSure'):icon('x')):null));
  });
  if(g.late)meta.append(h('span',{class:'pill late'},t('late')));
  var art=h('span',{class:'artno'+(g.article?' copy':' none'),title:g.article?t('copyNo'):t('noNumber'),onclick:g.article?function(){copyText(g.article);}:null},g.article||'–');
  var kk='g:'+g.key,sureG=S.confirm===kk;
  var ek='g:e:'+g.key;
  if(S.edit===ek)return h('div',{class:'card'},editForm(g.entries.map(function(e){return e.id;}),g.text,g.article,S.canWrite?kk:null));
  var ord=h('button',{type:'button',class:'ord'+(g.ordered?' on':''),'aria-pressed':String(g.ordered),disabled:(!S.canWrite||(locked&&!g.ordered))||null,onclick:function(){setForGroup(g,{ordered:!g.ordered});}},icon('check'),g.ordered?t('ordered'):t('markOrdered'));
  var chk=g.ordered&&g.entries.some(function(e){return checked[e.id];});
  if(chk)g.entries.forEach(function(e){delete checked[e.id];});
  return h('div',{class:'card'+(g.ordered?' done':'')+(freshOnce(g.entries)?' fresh':'')+(chk?' checked':''),'data-ids':g.entries.map(function(e){return e.id;}).join(',')},qtyBox(g.article,g.qty),h('div',{class:'main'},h('div',{class:'title copy',onclick:function(){copyText(g.text);}},g.text),meta),
    h('div',{class:'acts'},art,S.canWrite?editBtn(ek,'wide'):null,supSelect(g),findLink(effSup(g),g.text,g.article),ord));
}
function renderPeople(all){
  var m={},o=[];all.forEach(function(i){if(!m[i.by]){m[i.by]=[];o.push(i.by);}m[i.by].push(i);});
  o.sort(function(a,b){return a.localeCompare(b,lang);});
  var list=h('div',{class:'list'});
  o.forEach(function(n){
    var items=m[n],card=h('div',{class:'person'},h('h3',null,h('div',{class:'av'},(n[0]||'?').toUpperCase()),n,h('span',{class:'n'},items.length+' '+t('itemsN').toLowerCase())));
    items.forEach(function(i){card.append(h('div',{class:'line'+(i.ordered?' ordered':''),'data-id':i.id},h('span',{class:'q'},'×'+i.qty),h('span',{class:'t'},i.text),
      i.late?h('span',{class:'pill late'},t('late')):null,i.ordered?h('span',{class:'pill ok'},icon('check')):null,
      S.canWrite?h('button',{type:'button',class:'sq del'+(S.confirm==='i:'+i.id?' sure':''),'aria-label':t('delOne'),title:t('delOne'),onclick:function(){askDelete('i:'+i.id,[i.id]);}},S.confirm==='i:'+i.id?t('delSure'):icon('trash')):null));});
    list.append(card);
  });
  return list;
}
function buildCsv(){
  /* what is exported follows the supplier chip that is selected ("All" = everything still to order) */
  var gs=groups(todays()).filter(function(g){return !g.ordered&&inFilter(g);});
  if(!gs.length)return null;
  var rows=[['Artikelnr','Produkt','Antal','Beställare','Leverantör']];
  gs.forEach(function(g){var s=effSup(g);rows.push([g.article,g.text,g.qty,byPerson(g).map(function(p){return p.by+' '+p.qty;}).join(', '),s?s.name:'']);});
  return rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
}
async function copyCsv(){
  var txt=buildCsv();if(txt===null){toast(t('noCsv'));return;}
  try{await navigator.clipboard.writeText(txt);toast(t('copied'));}
  catch(e){S.csvText=txt;render();}
}
async function saveCsv(){
  var txt=buildCsv();if(txt===null){toast(t('noCsv'));return;}
  try{
    var url=URL.createObjectURL(new Blob(['\uFEFF'+txt],{type:'text/csv;charset=utf-8'}));
    var fs=S.supFilter!=='all'&&S.view!=='person'?supById(S.supFilter):null;
    var a=document.createElement('a');a.href=url;a.download='order-'+today()+(fs?'-'+fs.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''):'')+'.csv';
    document.body.append(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);toast(t('saved'));
  }catch(e){S.csvText=txt;render();}
}

/* history: every entry in the project as cards. Lead: grouped by date or by member. Member: own entries, by date.
   Pick a quantity (starts at 1) and add it to today's order. */
function histCard(x,fav){
  var out=h('output',null,String(S.hq[x.id]||1));
  function set(n){S.hq[x.id]=Math.max(1,Math.min(999,n));out.textContent=S.hq[x.id];replay(out,'bump');}
  function add(){var q=S.hq[x.id]||1;S.hq[x.id]=1;out.textContent='1';addItem(x.text,q,x.article);}
  var meta=h('div',{class:'meta'},fav?null:hhmm(x.at));
  if(fav){}
  else if(S.hview==='member')meta.prepend(dayLabel(x.date)+' · ');
  else if(isLead())meta.prepend(x.by+' · ');
  if(x.article)meta.append(h('span',{class:'pill art'},x.article));
  return h('div',{class:'card'},qtyBox(x.article,x.qty),h('div',{class:'main'},h('div',{class:'title'},x.text),meta),
    h('div',{class:'acts'},
      h('div',{class:'mini',role:'group','aria-label':'Quantity'},
        h('button',{type:'button','aria-label':'−',onclick:function(){set((S.hq[x.id]||1)-1);}},icon('minus')),out,
        h('button',{type:'button','aria-label':'+',onclick:function(){set((S.hq[x.id]||1)+1);}},icon('plus'))),
      fav?h('button',{type:'button',class:'sq on','aria-label':t('fav'),'aria-pressed':'true',title:t('fav'),onclick:function(){toggleFav(x.text);}},icon('star')):null,
      S.canWrite?h('button',{type:'button',class:'sq','aria-label':t('addAgain'),title:t('addAgain'),onclick:add},icon('plus')):null));
}
function renderHistory(){
  if(!S.hist){
    if(S.histErr)return emptyState(t('errServer'),'');
    if(S.histLoading)return h('p',{class:'hint',role:'status'},t('histLoading'));
  }
  var rows=(S.hist||[]).filter(function(x){return isLead()||x.by===S.session.name;});
  if(!rows.length)return emptyState(t('noHistory'),t('noHistoryP'));
  var byMember=isLead()&&S.hview==='member',m={},o=[];
  rows.forEach(function(x){var k=byMember?x.by:x.date;if(!m[k]){m[k]=[];o.push(k);}m[k].push(x);});
  if(byMember)o.sort(function(a,b){return a.localeCompare(b,lang);});
  else o.sort().reverse();
  var wrap=h('div');
  o.forEach(function(k){
    var list=h('div',{class:'list'});
    m[k].forEach(function(x){list.append(histCard(x));});
    wrap.append(h('h3',{class:'grph'},byMember?h('div',{class:'av'},(k[0]||'?').toUpperCase()):null,byMember?k:dayLabel(k),h('span',{class:'n'},String(m[k].length))),list);
  });
  return wrap;
}

/* ---------- suppliers screen (leads) ----------
   Pick the project's default supplier from the list, and add, change or delete the company's own suppliers. */
function renderSuppliers(){
  var wrap=h('div');
  wrap.append(h('p',{class:'hint',style:'margin:0 0 14px'},t('supHint')));
  var list=h('div',{class:'list'});
  S.sups.forEach(function(x){if(x.hidden&&S.defaultId!==x.id)return;list.append(supCard(x));});
  wrap.append(list,supForm());
  return wrap;
}
function supCard(x){
  var isDef=S.defaultId===x.id,mine=!!x.co,k='s:'+x.id,sure=S.confirm===k;
  var meta=h('div',{class:'meta'});
  if(mine)meta.append(h('span',{class:'pill'},t('own')),supHost(x.url));
  var acts=h('div',{class:'acts'});
  acts.append(h('button',{type:'button',class:'ord'+(isDef?' on':''),'aria-pressed':String(isDef),disabled:!S.canWrite||null,
    onclick:function(){if(!isDef)setDefault(x.id);}},icon('check'),isDef?t('defaultPill'):t('setDefault')));
  if(mine&&S.canWrite){
    acts.append(h('button',{type:'button',class:'sq','aria-label':t('edit')+': '+x.name,title:t('edit'),onclick:function(){S.supEdit=x.id;render();var i=document.getElementById('supName');if(i)i.focus();}},icon('edit')));
    acts.append(h('button',{type:'button',class:'sq del'+(sure?' sure':''),'aria-label':t('supDelete')+': '+x.name,title:sure?t('supDeleteSure'):t('supDelete'),onclick:function(){askDeleteSup(x.id);}},sure?t('supDeleteSure'):icon('trash')));
  }
  return h('div',{class:'card'+(isDef?' done':'')},h('div',{class:'main'},h('div',{class:'title'},x.name),meta),acts);
}
function supForm(){
  var e=S.supEdit?supById(S.supEdit):null;
  if(!S.canWrite)return null;
  var name=h('input',{type:'text',id:'supName',maxlength:'40',value:e?e.name:null,placeholder:t('supNamePh'),autocomplete:'off'});
  var url=h('input',{type:'text',id:'supUrl',maxlength:'300',value:e?e.url:null,placeholder:t('supUrlPh'),autocomplete:'off',autocapitalize:'off',spellcheck:'false',inputmode:'url'});
  return h('form',{class:'form supform',onsubmit:function(ev){ev.preventDefault();saveSupplier(e?e.id:null,name.value,url.value);}},
    h('h3',{style:'margin:0;font-size:17px'},e?t('supEditTitle'):t('supAdd')),
    h('label',null,t('supName'),name),
    h('label',null,t('supUrl'),url,h('span',{class:'hint'},t('supUrlHint'))),
    h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
      h('button',{type:'submit',class:'btn pri'},icon('check'),t('supSave')),
      e?h('button',{type:'button',class:'btn',onclick:function(){S.supEdit=null;render();}},t('supCancel')):null));
}

/* ---------- boot ---------- */
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&S.session&&!S.demo)refetch(S.gen); });
document.addEventListener('focusout',function(){ if(S.dirty){setTimeout(function(){ if(!typing()){S.dirty=false;render();} },60);} });
function recent(it){var d=new Date(it.at);return !isNaN(d)&&Date.now()-d<3000;}
var saved=null;try{saved=JSON.parse(ls('ol.session')||'null');}catch(e){}
if(saved&&saved.co&&saved.pid&&saved.name&&(saved.role==='lead'||saved.role==='electrician'))start(saved);else showJoin();
})();
